services:
  stage-gate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirevox/stage-gate:local
    ports:
      - "${STAGE_GATE_PORT:-3847}:3847"
    environment:
      NODE_ENV: production
      PORT: "3847"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    # No secrets required. Project state lives in the browser (localStorage),
    # so this container is intentionally stateless.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3847/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
